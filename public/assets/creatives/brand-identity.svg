<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg_MinimalistBrandIdentitySuite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#pBg_MinimalistBrandIdentitySuite)" />

  <!-- Ambient circles -->
  <circle cx="500" cy="80" r="120" fill="#10B981" opacity="0.15" />
  <circle cx="100" cy="340" r="100" fill="#155EEF" opacity="0.12" />

  <g transform="translate(40, 40)" filter="url(#pShadow)">
    <rect width="520" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#334155" />
    
    <!-- Category Pill -->
    <rect x="24" y="24" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" />
    <text x="89" y="40" font-family="sans-serif" font-size="10" font-weight="800" fill="#10B981" text-anchor="middle">BRANDING</text>

    <!-- Main Visual Content -->
    <g transform="translate(200, 80)">
    <circle cx="60" cy="60" r="45" fill="none" stroke="#10B981" stroke-width="2" />
    <rect x="35" y="35" width="50" height="50" rx="8" fill="#10B981" fill-opacity="0.3" stroke="#10B981" />
  </g>

    <!-- Title and Subtitle -->
    <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">Minimalist Brand Identity Suite</text>
    <text x="24" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Clean vector geometry, typography, and brand digital guidelines</text>
    <text x="496" y="320" font-family="monospace" font-size="9" font-weight="700" fill="#10B981" text-anchor="end">SUDHARSHAN_TECH CREATIVE LAB</text>
  </g>
</svg>