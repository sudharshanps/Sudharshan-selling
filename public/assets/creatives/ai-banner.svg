<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg_AIVisionMarketingBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#pBg_AIVisionMarketingBanner)" />

  <!-- Ambient circles -->
  <circle cx="500" cy="80" r="120" fill="#F59E0B" opacity="0.15" />
  <circle cx="100" cy="340" r="100" fill="#155EEF" opacity="0.12" />

  <g transform="translate(40, 40)" filter="url(#pShadow)">
    <rect width="520" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#334155" />
    
    <!-- Category Pill -->
    <rect x="24" y="24" width="130" height="24" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" />
    <text x="89" y="40" font-family="sans-serif" font-size="10" font-weight="800" fill="#F59E0B" text-anchor="middle">ADVERTISEMENTS</text>

    <!-- Main Visual Content -->
    <g transform="translate(180, 80)">
    <rect width="160" height="110" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="80" cy="55" r="28" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="80" cy="55" r="10" fill="#F59E0B" />
  </g>

    <!-- Title and Subtitle -->
    <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">AI Vision Marketing Banner</text>
    <text x="24" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">High-conversion targeted creatives for deep-tech algorithms</text>
    <text x="496" y="320" font-family="monospace" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="end">SUDHARSHAN_TECH CREATIVE LAB</text>
  </g>
</svg>