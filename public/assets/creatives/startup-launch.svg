<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg_TechStartupLaunchPoster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#pBg_TechStartupLaunchPoster)" />

  <!-- Ambient circles -->
  <circle cx="500" cy="80" r="120" fill="#3B82F6" opacity="0.15" />
  <circle cx="100" cy="340" r="100" fill="#155EEF" opacity="0.12" />

  <g transform="translate(40, 40)" filter="url(#pShadow)">
    <rect width="520" height="340" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#334155" />
    
    <!-- Category Pill -->
    <rect x="24" y="24" width="130" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" />
    <text x="89" y="40" font-family="sans-serif" font-size="10" font-weight="800" fill="#3B82F6" text-anchor="middle">BUSINESS POSTERS</text>

    <!-- Main Visual Content -->
    <g transform="translate(180, 80)">
    <rect width="160" height="110" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <polygon points="260,105 275,135 245,135" fill="#3B82F6" />
    <circle cx="260" cy="155" r="14" fill="#60A5FA" />
  </g>

    <!-- Title and Subtitle -->
    <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">Tech Startup Launch Poster</text>
    <text x="24" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">High-impact visual identity for seed-stage deep-tech launches</text>
    <text x="496" y="320" font-family="monospace" font-size="9" font-weight="700" fill="#3B82F6" text-anchor="end">SUDHARSHAN_TECH CREATIVE LAB</text>
  </g>
</svg>